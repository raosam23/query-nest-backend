[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for QueryNest, a multi-agent research assistant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg==0.31.0",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.133.1",
    "greenlet>=3.3.2",
    "langchain>=1.2.10",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.10",
    "langgraph>=1.0.10",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.1",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy[asyncio]>=2.0.47",
    "sqlmodel>=0.0.37",
    "tavily-python>=0.7.22",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "pyright>=1.1.409",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
src = ["app", "tests"]
line-length = 120
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "F821"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
# Side-effect import: registers SQLModel tables before create_all.
"app/db/database.py" = ["F401"]

[tool.pyright]
include = ["app", "tests"]
exclude = ["alembic", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*TavilySearchResults.*:langchain_core._api.deprecation.LangChainDeprecationWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]
